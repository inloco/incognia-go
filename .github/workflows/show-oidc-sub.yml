name: Show GitHub OIDC claims

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  show-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Request and display OIDC claims
        shell: bash
        run: |
          payload=$(
            printf '%s' "$GITHUB_TOKEN" |
              cut -d. -f2 |
              tr '_-' '/+'
          )

          printf '%s' "$payload$(printf '=%.0s' $(seq 1 $(( (4 - ${#payload} % 4) % 4 ))))" |
            base64 --decode |
            jq -r '.sub'
