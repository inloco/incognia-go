name: Show GitHub OIDC claims

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  id-token: write
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  show-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC subject
        shell: bash
        run: |
          token="$(
            curl --fail --silent \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=my-audience" |
            jq -r '.value'
          )"

          payload="$(
            printf '%s' "$token" |
              cut -d. -f2 |
              tr '_-' '/+'
          )"

          padding=$(( (4 - ${#payload} % 4) % 4 ))

          printf '%s' "$payload$(printf '%*s' "$padding" '' | tr ' ' '=')" |
            base64 --decode |
            jq -r '.sub'